<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1e3a8a" stroke-width="8"/>

  <!-- Gear -->
  <g transform="translate(256,256)">
    <!-- Gear teeth -->
    <path d="M0,-140 L20,-140 L25,-120 L-25,-120 L-20,-140 Z" fill="url(#gearGrad)" transform="rotate(0)"/>
    <path d="M0,-140 L20,-140 L25,-120 L-25,-120 L-20,-140 Z" fill="url(#gearGrad)" transform="rotate(30)"/>
    <path d="M0,-140 L20,-140 L25,-120 L-25,-120 L-20,-140 Z" fill="url(#gearGrad)" transform="rotate(60)"/>
    <path d="M0,-140 L20,-140 L25,-120 L-25,-120 L-20,-140 Z" fill="url(#gearGrad)" transform="rotate(90)"/>
    <path d="M0,-140 L20,-140 L25,-120 L-25,-120 L-20,-140 Z" fill="url(#gearGrad)" transform="rotate(120)"/>
    <path d="M0,-140 L20,-140 L25,-120 L-25,-120 L-20,-140 Z" fill="url(#gearGrad)" transform="rotate(150)"/>
    <path d="M0,-140 L20,-140 L25,-120 L-25,-120 L-20,-140 Z" fill="url(#gearGrad)" transform="rotate(180)"/>
    <path d="M0,-140 L20,-140 L25,-120 L-25,-120 L-20,-140 Z" fill="url(#gearGrad)" transform="rotate(210)"/>
    <path d="M0,-140 L20,-140 L25,-120 L-25,-120 L-20,-140 Z" fill="url(#gearGrad)" transform="rotate(240)"/>
    <path d="M0,-140 L20,-140 L25,-120 L-25,-120 L-20,-140 Z" fill="url(#gearGrad)" transform="rotate(270)"/>
    <path d="M0,-140 L20,-140 L25,-120 L-25,-120 L-20,-140 Z" fill="url(#gearGrad)" transform="rotate(300)"/>
    <path d="M0,-140 L20,-140 L25,-120 L-25,-120 L-20,-140 Z" fill="url(#gearGrad)" transform="rotate(330)"/>

    <!-- Gear body -->
    <circle cx="0" cy="0" r="115" fill="url(#gearGrad)"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#94a3b8" stroke-width="3"/>

    <!-- Center hole -->
    <circle cx="0" cy="0" r="35" fill="#1e40af"/>
    <circle cx="0" cy="0" r="25" fill="#3b82f6"/>
  </g>

  <!-- RJ Text -->
  <text x="256" y="275" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#1e3a8a" text-anchor="middle">RJ</text>
</svg>
