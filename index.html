<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fontes carregadas de forma NAO-bloqueante: o app renderiza com a fonte
         do sistema imediatamente e troca para a Inter quando (e se) baixar.
         Evita tela branca quando a internet da empresa esta lenta/instavel. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>RJ Usinagem - Sistema de Gestão</title>
    <style>
      /* Loader inicial — aparece no primeiro frame, sem depender de JS nem de
         fonte externa. O React substitui o conteudo de #root ao montar,
         removendo este loader automaticamente. Mata a "tela branca" no boot. */
      #app-boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #app-boot-loader .rj-badge {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        background: #2563eb;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      #app-boot-loader .rj-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: rj-spin 0.8s linear infinite;
      }
      #app-boot-loader .rj-text {
        color: #6b7280;
        font-size: 14px;
      }
      @keyframes rj-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Rede de seguranca de boot: se o React NAO montar (ex.: erro fatal no
      // bundle), o usuario veria tela branca / spinner travado sem pista. Aqui
      // capturamos o primeiro erro e, apos um tempo, trocamos o loader por uma
      // mensagem legivel — transformando "tela branca" em diagnostico.
      (function () {
        var firstError = ''
        function capture(msg) {
          if (!firstError && msg) firstError = String(msg)
        }
        function escapeHtml(s) {
          return s.replace(/[<>&]/g, function (c) {
            return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]
          })
        }
        window.addEventListener(
          'error',
          function (e) {
            capture((e && e.message) || (e && e.error && e.error.message))
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (e) {
          capture(e && e.reason && (e.reason.message || e.reason))
        })
        setTimeout(function () {
          // Loader ainda presente => o React nao montou (boot falhou).
          if (!document.getElementById('app-boot-loader')) return
          var root = document.getElementById('root')
          if (!root) return
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;flex-direction:column;' +
            'align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;' +
            "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;" +
            'background:#fafafa;color:#374151;">' +
            '<div style="font-size:18px;font-weight:600;color:#b91c1c;">Nao foi possivel iniciar o RJ Usinagem</div>' +
            '<div style="font-size:14px;max-width:520px;line-height:1.5;">O aplicativo nao carregou ' +
            'corretamente. Verifique sua conexao com a internet e reabra. Se persistir, contate o ' +
            'suporte e informe a mensagem abaixo.</div>' +
            (firstError
              ? '<code style="font-size:12px;background:#f3f4f6;border:1px solid #e5e7eb;' +
                'border-radius:6px;padding:8px 12px;max-width:520px;word-break:break-word;' +
                'color:#6b7280;">' +
                escapeHtml(firstError) +
                '</code>'
              : '')
        }, 8000)
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-boot-loader">
        <div class="rj-badge">RJ</div>
        <div class="rj-spinner"></div>
        <div class="rj-text">Carregando RJ Usinagem…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
