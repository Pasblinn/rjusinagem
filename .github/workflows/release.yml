name: Release

# Dispara em push de tag vX.Y.Z
# Builda o instalador Windows nativo e publica como release marcado como "latest",
# incluindo latest.yml exigido pelo electron-updater.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          # createClient() do supabase-js exige URL valida no import-time.
          # Em CI nao temos .env (gitignored), entao injetamos fakes para os
          # testes de smoke do client (nenhum teste faz request real).
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJfake_key_for_ci_only
        run: npm run test:run

      # Vite embute VITE_* no bundle em BUILD-TIME. Sem estas variaveis o
      # createClient() do Supabase recebe strings vazias e lanca
      # "supabaseUrl is required." no import -> o React nao monta -> TELA BRANCA
      # no app publicado. (O build local funcionava porque le o .env.) Sao
      # chaves publicas (URL + anon key, protegidas por RLS); ficam em repo
      # secrets so para nao versionar configuracao.
      - name: Build web bundle (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Guarda: aborta ANTES de publicar se as credenciais nao entraram no
      # bundle. Torna impossivel reincidir na tela branca por env faltando.
      - name: Guard — credenciais Supabase embutidas no bundle
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Secret VITE_SUPABASE_URL ausente. Configure em Settings > Secrets and variables > Actions. Sem ela o app abre em tela branca."
            exit 1
          fi
          host=$(printf '%s' "$VITE_SUPABASE_URL" | sed -E 's#^https?://([^/.]+).*#\1#')
          if ! grep -rqF "$host" dist/assets; then
            echo "::error::URL do Supabase NAO foi embutida no bundle (dist/assets). Build abortado para evitar tela branca."
            exit 1
          fi
          echo "OK: credenciais Supabase presentes no bundle."

      # --publish always faz o electron-builder criar o release no GitHub
      # com o .exe, .blockmap e latest.yml (necessario para auto-update).
      - name: Package & publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
