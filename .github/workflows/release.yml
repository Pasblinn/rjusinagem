name: Release

# Dispara em push de tag vX.Y.Z
# Builda o instalador Windows nativo e publica como release marcado como "latest",
# incluindo latest.yml exigido pelo electron-updater.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build & publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --publish always faz o electron-builder criar o release no GitHub
        # com o .exe, .blockmap e latest.yml (necessario para auto-update)
        run: npm run build:win -- --publish always
